<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智能提醒管理平台 - 管理后台</title>
    <!-- 防止白屏闪烁：提前读取主题并设置背景色 -->
    <script>
      (function () {
        const theme = localStorage.getItem('helper-theme') || 'dark';
        const bgMap = {
          dark: '#0d1117',
          light: '#f5f7fa',
        };
        const bg = bgMap[theme] || '#0d1117';
        document.documentElement.style.background = bg;
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <style>
      html, body, #app {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: inherit;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
